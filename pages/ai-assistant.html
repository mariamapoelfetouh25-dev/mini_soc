<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mini-SOC AI Security Assistant — demo cybersecurity chat (scripted sample replies, no AI model connected).">
<meta name="color-scheme" content="light dark">
<title>AI Assistant — Mini-SOC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233478F6' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3.2l7 2.9v5.4c0 4.2-2.9 7.3-7 8.5-4.1-1.2-7-4.3-7-8.5V6.1z'/%3E%3Cpath d='M9 12.2l2.2 2.2 3.8-4.1'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var theme = localStorage.getItem("soc.theme");
    if (theme !== "dark" && theme !== "light") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
    var motion = localStorage.getItem("soc.motion");
    if (motion === "reduced") document.documentElement.setAttribute("data-motion", "reduced");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/chat.css">
</head>
<body data-page="ai-assistant" data-root="..">
<a class="skip-link" href="#main-content">Skip to main content</a>

<div id="app-shell"></div>

<main id="main-content" class="page" tabindex="-1">
  <div class="page-inner">

    <header class="page-head">
      <div>
        <div class="row row-wrap" style="gap:12px">
          <h1 class="page-title">AI Security Assistant</h1>
          <span class="demo-flag">Demo · scripted responses</span>
        </div>
        <p class="page-desc">
          Your intelligence layer for threat investigation and security guidance.
          Replies are scripted samples generated in this browser — <b>no AI model,
          backend or API key is connected</b>.
        </p>
      </div>
      <div class="page-actions">
        <span class="badge" id="aa-mode-chip" aria-live="polite">Mode: General Assistant</span>
        <span class="popover-host">
          <button class="btn" type="button" id="aa-history-btn" aria-haspopup="true" aria-expanded="false">
            History
          </button>
        </span>
        <button class="btn btn-primary" type="button" id="aa-new-btn">New conversation</button>
      </div>
    </header>

    <section class="card chat-panel" aria-label="Chat with the AI Security Assistant">
      <div id="aa-chat-mount"></div>
    </section>

  </div>
</main>

<div id="overlay-root"></div>

<script src="../js/utils.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/demo-scenarios.js"></script>
<script src="../js/services.js"></script>
<script src="../js/components.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/network-graph.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/chat-service.js"></script>
<script src="../js/chat-ui.js"></script>
<script src="../js/pages/ai-assistant.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
