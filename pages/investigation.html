<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mini-SOC incident investigation workspace — evidence, timeline and ATT&CK context.">
<meta name="color-scheme" content="light dark">
<title>Incident Investigation — Mini-SOC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233478F6' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3.2l7 2.9v5.4c0 4.2-2.9 7.3-7 8.5-4.1-1.2-7-4.3-7-8.5V6.1z'/%3E%3Cpath d='M9 12.2l2.2 2.2 3.8-4.1'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var theme = localStorage.getItem("soc.theme");
    if (theme !== "dark" && theme !== "light") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
    var motion = localStorage.getItem("soc.motion");
    if (motion === "reduced") document.documentElement.setAttribute("data-motion", "reduced");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/chat.css">
</head>
<body data-page="investigation" data-root="..">
<a class="skip-link" href="#main-content">Skip to main content</a>

<div id="app-shell"></div>

<main id="main-content" class="page" tabindex="-1">
  <div class="page-inner" id="investigation-root">

    <header class="page-head">
      <div>
        <div class="row row-wrap" style="gap:10px">
          <a class="btn btn-sm" href="incidents.html" id="inv-back">← All incidents</a>
          <span class="demo-flag">Demo · sample data</span>
        </div>
        <p class="page-desc" id="inv-context" style="margin-top:10px"></p>
      </div>
      <div class="page-actions" id="inv-actions"></div>
    </header>

    <!-- Incident summary (rendered by js/pages/investigation.js) -->
    <div id="incident-hero"></div>

    <!-- Section tabs: context is preserved while switching panels -->
    <div class="tabs invest-tabs" role="tablist" aria-label="Incident investigation sections" id="inv-tabs">
      <button class="tab" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-tab="overview">Overview</button>
      <button class="tab" role="tab" id="tab-events" aria-controls="panel-events" aria-selected="false" data-tab="events" tabindex="-1">Related events</button>
      <button class="tab" role="tab" id="tab-timeline" aria-controls="panel-timeline" aria-selected="false" data-tab="timeline" tabindex="-1">Timeline</button>
      <button class="tab" role="tab" id="tab-mitre" aria-controls="panel-mitre" aria-selected="false" data-tab="mitre" tabindex="-1">MITRE ATT&amp;CK</button>
      <button class="tab" role="tab" id="tab-ai" aria-controls="panel-ai" aria-selected="false" data-tab="ai" tabindex="-1">AI analysis</button>
      <button class="tab" role="tab" id="tab-evidence" aria-controls="panel-evidence" aria-selected="false" data-tab="evidence" tabindex="-1">Evidence</button>
    </div>

    <div class="tab-panel stack-4">
      <section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
      <section id="panel-events" role="tabpanel" aria-labelledby="tab-events" tabindex="0" hidden></section>
      <section id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline" tabindex="0" hidden></section>
      <section id="panel-mitre" role="tabpanel" aria-labelledby="tab-mitre" tabindex="0" hidden></section>
      <section id="panel-ai" role="tabpanel" aria-labelledby="tab-ai" tabindex="0" hidden></section>
      <section id="panel-evidence" role="tabpanel" aria-labelledby="tab-evidence" tabindex="0" hidden></section>
    </div>

  </div>
</main>

<div id="overlay-root"></div>

<script src="../js/utils.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/demo-scenarios.js"></script>
<script src="../js/services.js"></script>
<script src="../js/components.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/network-graph.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/chat-service.js"></script>
<script src="../js/chat-ui.js"></script>
<script src="../js/pages/investigation.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
